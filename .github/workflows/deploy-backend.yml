name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - 'docker-compose.prod.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests
        run: mvn test
        working-directory: ./backend

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: |
          echo "IMAGE_NAME_LOWER=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


  deploy:
    runs-on: [self-hosted, linux, x64]
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Application
        run: |
          mkdir -p /home/italo-server/uni-stay
          cp docker-compose.prod.yml /home/italo-server/uni-stay/

          cd /home/italo-server/uni-stay

          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          test -f .env || (echo ".env não encontrado" && exit 1)

          sed -i '/^APP_VERSION=/d' .env || true
          echo "APP_VERSION=sha-${{ github.sha }}" >> .env

          docker compose -f docker-compose.prod.yml pull backend
          docker compose -f docker-compose.prod.yml up -d

          docker image prune -f

      - name: Discord Success Notification
        if: success()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Utilizando jq para garantir que quebras de linha e aspas na mensagem de commit não quebrem o JSON
          PAYLOAD=$(jq -n --arg msg "$COMMIT_MSG" '{
            "embeds": [{
              "title": "🚀 Deploy Concluído",
              "description": "Nova versão do UniStay publicada com sucesso.",
              "color": 3066993,
              "fields": [
                { "name": "👤 Autor", "value": "${{ github.actor }}", "inline": true },
                { "name": "🌿 Branch", "value": "${{ github.ref_name }}", "inline": true },
                { "name": "📦 Commit", "value": "${{ github.sha }}", "inline": false },
                { "name": "📝 Mensagem", "value": $msg, "inline": false }
              ]
            }]
          }')
          
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Discord Failure Notification
        if: failure()
        run: |
          PAYLOAD=$(jq -n '{
            "embeds": [{
              "title": "❌ Falha no Deploy",
              "description": "O processo de deploy do UniStay falhou.",
              "color": 15158332,
              "fields": [
                { "name": "👤 Autor", "value": "${{ github.actor }}", "inline": true },
                { "name": "🌿 Branch", "value": "${{ github.ref_name }}", "inline": true },
                { "name": "📦 Commit", "value": "${{ github.sha }}", "inline": false }
              ]
            }]
          }')
          
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "${{ secrets.DISCORD_WEBHOOK }}"
